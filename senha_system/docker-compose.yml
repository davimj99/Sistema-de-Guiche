services:
  db:
    image: postgres:17
    container_name: guiche_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - guiche_network

  nginx:
    image: nginx:alpine
    container_name: guiche_nginx
    restart: unless-stopped
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    networks:
      - guiche_network

  web:
    build: .
    container_name: guiche_web
    restart: unless-stopped
    env_file:
      - .env

    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn senha_system.wsgi:application --bind 0.0.0.0:8000 --workers 3"

    expose:
      - "8000"
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    depends_on:
      db:
        condition: service_healthy
    networks:
      - guiche_network

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  guiche_network:
    driver: bridge
