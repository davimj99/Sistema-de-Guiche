{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/filas.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}

<div class="painel-tv">

    <h1>
        Painel de Atendimento ISCON
        <button onclick="ativarAudio()" id="btnAudio">
            🔊 Ativar áudio
        </button>
    </h1>

    <div class="layout">

        <!-- BANNER / PROPAGANDA (agora dentro do layout) -->
        <div class="propaganda">
            <img id="banner-img" class="ativo" alt="Banner" />
            <video
                id="banner-video"
                muted
                autoplay
                playsinline
                preload="auto"
            >
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>

        <!-- SENHA ATUAL -->
        <div class="container-senha">
            <h2 id="senha-atual">Aguardando...</h2>
            <h3 id="guiche-atual"></h3>
        </div>

        <!-- LISTAS LATERAIS -->
        <div class="container-listas">

            <div class="box">
                <h3>Últimas chamadas</h3>
                <ul id="ultimas-lista"></ul>
            </div>

            <div class="box">
                <h3>Fila de espera</h3>
                <ul id="fila-lista"></ul>
            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}
{{ propagandas|json_script:"banners-data" }}

<script>

let ultimaChamada = null;
let audioLiberado = false;


/* ATIVAR ÁUDIO */
function ativarAudio(){
    const teste = new SpeechSynthesisUtterance("Áudio ativado");
    teste.lang = "pt-BR";

    window.speechSynthesis.speak(teste);
    audioLiberado = true;

    document.getElementById("btnAudio").style.display = "none";
}


/* FALAR SENHA */
function falarSenha(senha, guiche){

    if(!audioLiberado) return;

    const texto = `Senha ${senha}, dirigir-se ao guichê ${guiche}`;

    const speech = new SpeechSynthesisUtterance(texto);
    speech.lang = "pt-BR";
    speech.rate = 0.9;

    window.speechSynthesis.cancel();
    window.speechSynthesis.speak(speech);
}


/* ATUALIZAR PAINEL */
async function atualizarPainel(){

    try {

        const response = await fetch("/filas/tv/data/");
        const data = await response.json();

        // SENHA ATUAL
        if(data.ultima){

            const senha = data.ultima.senha;
            const guiche = data.ultima.guiche;

            const senhaEl = document.getElementById("senha-atual");
            const guicheEl = document.getElementById("guiche-atual");

            senhaEl.innerText = senha;
            guicheEl.innerText = "Dirija-se ao guichê " + guiche;

            // animação
            senhaEl.classList.remove("destaque");
            void senhaEl.offsetWidth;
            senhaEl.classList.add("destaque");

            // áudio
            const chamadaAtual = senha + "-" + guiche;

            if(ultimaChamada !== chamadaAtual){
                ultimaChamada = chamadaAtual;
                falarSenha(senha, guiche);
            }
        }

        // ÚLTIMAS CHAMADAS
        const ultimasLista = document.getElementById("ultimas-lista");
        ultimasLista.innerHTML = "";

        data.ultimas.forEach((item, index) => {
            const li = document.createElement("li");
            li.innerText = `Senha ${item.senha} - Guichê ${item.guiche}`;

            if(index === 0){
                li.classList.add("highlight");
            }

            ultimasLista.appendChild(li);
        });

        // FILA
        const filaLista = document.getElementById("fila-lista");
        filaLista.innerHTML = "";

        data.fila.forEach(s => {
            const li = document.createElement("li");
            li.innerText = s;
            filaLista.appendChild(li);
        });

    } catch (error){
        console.error("Erro:", error);
    }
}


// AUTO UPDATE
setInterval(atualizarPainel, 3000);
atualizarPainel();

const banners = JSON.parse(
    document.getElementById("banners-data").textContent
);

let bannerIndex = 0;
let timerBanner = null;

function trocarBanner(){

    const imgEl = document.getElementById("banner-img");
    const videoEl = document.getElementById("banner-video");
    const sourceEl = document.getElementById("video-source");

    if(banners.length === 0){

        imgEl.src = "/static/img/sem-propaganda.png";

        imgEl.classList.add("ativo");
        videoEl.classList.remove("ativo");

        return;
    }

    const arquivo = banners[bannerIndex];

    const arquivoLower = arquivo.toLowerCase();

    const isVideo =
        arquivoLower.includes(".mp4") ||
        arquivoLower.includes(".webm") ||
        arquivoLower.includes(".ogg");

    clearTimeout(timerBanner);

    if(isVideo){

        console.log("VIDEO:", arquivo);

        imgEl.classList.remove("ativo");

        videoEl.pause();

        sourceEl.src = "/media/" + arquivo;

        videoEl.load();

        videoEl.classList.add("ativo");

        videoEl.play()
        .then(() => {

            console.log("Vídeo iniciado");

        })
        .catch((erro) => {

            console.log("Erro vídeo:", erro);

        });

        videoEl.onended = () => {

            bannerIndex = (bannerIndex + 1) % banners.length;

            trocarBanner();
        };

    }else{

        console.log("IMAGEM:", arquivo);
        videoEl.pause();
        videoEl.classList.remove("ativo");
        imgEl.src = "/media/" + arquivo;
        imgEl.classList.add("ativo");
        timerBanner = setTimeout(() => {
            bannerIndex = (bannerIndex + 1) % banners.length;
            trocarBanner();

        }, 8000);
    }
}

trocarBanner();
</script>

{% endblock %}
