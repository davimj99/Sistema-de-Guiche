{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'frontend/css/filas.css' %}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;700;900&family=Barlow:wght@400;600;700&display=swap" rel="stylesheet">
{% endblock %}

{% block content %}

<div class="painel-tv">

    <h1>
        Painel de Atendimento ISCON
        <button onclick="ativarAudio()" id="btnAudio">
            🔊 Ativar áudio
        </button>
    </h1>

    <div class="layout">

        <!-- BANNER / PROPAGANDA (agora dentro do layout) -->
        <div class="propaganda">
            <img id="banner-img" class="ativo" alt="Banner" />
            <video
                id="banner-video"
                muted
                autoplay
                playsinline
                preload="auto"
            >
                <source id="video-source" src="" type="video/mp4">
            </video>
        </div>

        <!-- SENHA ATUAL -->
        <div class="container-senha">
            <h2 id="senha-atual">Aguardando...</h2>
            <h3 id="guiche-atual"></h3>
        </div>

        <!-- LISTAS LATERAIS -->
        <div class="container-listas">

            <div class="box">
                <h3>Últimas chamadas</h3>
                <ul id="ultimas-lista"></ul>
            </div>

            <div class="box">
                <h3>Fila de espera</h3>
                <ul id="fila-lista"></ul>
            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block extra_js %}
{{ propagandas|json_script:"banners-data" }}
<script src="{% static 'frontend/js/painel_tv.js' %}"></script>
{% endblock %}
