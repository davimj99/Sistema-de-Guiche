{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultar solicitação | Wi-Fi ISCON</title>
    <link rel="stylesheet" href="{% static 'frontend/css/wifi/minhas_solicitacoes.css' %}">
    <link rel="icon" href="{% static 'frontend/img/iscon_logo.png' %}" type="image/png">
</head>

<body>
    <header class="wifi-header">
        <img src="{% static 'frontend/img/iscon2.png' %}" alt="ISCON" class="logo">
        <div>
            <h1>Wi-Fi ISCON</h1>
            <p>Portal do aluno</p>
        </div>
    </header>

    <main class="container">
        <section class="consulta-card">
            <div class="consulta-icon"> ? </div>
            <h1> Consultar solicitação</h1>

            <p class="descricao">
                Informe o protocolo recebido após realizar
                sua solicitação de acesso ao Wi-Fi.
            </p>

            <form method="GET" action="{% url 'wifi:minhas_solicitacoes' %}">
                <div class="form-group">
                    <label for="protocolo"> Protocolo </label>
                    <input
                        type="text"
                        id="protocolo"
                        name="protocolo"
                        placeholder="WIFI-2026-000001"
                        maxlength="30"
                        autocomplete="off"
                        required >
                </div>

                <button type="submit" class="btn-consultar">
                    Consultar solicitação
                </button>
            </form>


            {% if erro %}
                <div class="erro"> {{ erro }}</div>
            {% endif %}

            <div class="acoes">
                <a href="{% url 'wifi:solicitar' %}" class="btn-nova">
                    Nova solicitação
                </a>
            </div>
        </section>
    </main>
</body>
</html>
