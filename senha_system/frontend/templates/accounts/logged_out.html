{% extends "base.html" %}
{% load static %}

{% block title %}Sessão Encerrada | Sistema ISCON{% endblock %}

{% block extra_css %}
<style>
.auth-wrapper {
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 50vh;
    padding: 30px 0;
}

.auth-card {
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    width: 100%;
    max-width: 440px;
    padding: 35px 30px;
    text-align: center;
    border-top: 5px solid #198754;
}

.auth-card h2 {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--azul-escuro, #0a3d91);
    margin-bottom: 12px;
}

.auth-card p {
    color: var(--cinza-texto, #5a6070);
    margin-bottom: 25px;
    font-size: 1rem;
}

.auth-btn {
    display: inline-block;
    padding: 12px 24px;
    background: var(--azul-iscon, #0d6efd);
    color: #ffffff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    transition: background 0.2s ease;
}

.auth-btn:hover {
    background: var(--azul-escuro, #0a3d91);
}
</style>
{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Sessão Encerrada</h2>
        <p>Você saiu do sistema com segurança.</p>
        <a href="{% url 'accounts:login' %}" class="auth-btn">Fazer Login Novamente</a>
    </div>
</div>
{% endblock %}
