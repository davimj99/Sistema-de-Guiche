name: CI - Sistema de Guichê

on:
  push:
    branches:
      - release/**
  pull_request:
    branches:
      - main
      - release/**

jobs:
  test:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: guiche_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guiche_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      SECRET_KEY: "django-ci-secret-key"
      DEBUG: "False"
      DB_NAME: "guiche_db"
      DB_USER: "postgres"
      DB_PASSWORD: "postgres"
      DB_HOST: "localhost"
      DB_PORT: "5432"

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verificar Django
        working-directory: senha_system
        run: |
          python manage.py check

      - name: Verificar migrações
        working-directory: senha_system
        run: |
          python manage.py makemigrations --check --dry-run

      - name: Aplicar migrações
        working-directory: senha_system
        run: |
          python manage.py migrate

      - name: Rodar testes
        working-directory: senha_system
        run: |
          python manage.py test